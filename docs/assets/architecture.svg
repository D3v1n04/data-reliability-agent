<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Data Reliability Agent production architecture</title>
  <desc id="desc">A browser reaches a private React frontend and FastAPI Lambda through CloudFront. Lambda evaluates deterministic rules, stores operational and vector memory in CockroachDB, and invokes Amazon Bedrock for embeddings and bounded diagnoses. SSM supplies the database URL and CloudWatch receives logs, metrics, and alarms.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="memory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="compute" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .lane { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.7px; fill: #64748b; }
      .node-title { font: 700 19px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .node-copy { font: 400 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .node-accent { font: 600 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #9a3412; }
      .edge-label { font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .box { stroke: #cbd5e1; stroke-width: 1.5; rx: 18; }
      .line { fill: none; stroke: #475569; stroke-width: 2.2; }
      .memory-line { fill: none; stroke: #c2410c; stroke-width: 2.5; }
      .support-line { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#background)"/>
  <text x="70" y="68" class="title">Data Reliability Agent — production architecture</text>
  <text x="70" y="99" class="subtitle">Deterministic detection establishes facts. CockroachDB remembers. Bedrock explains within guardrails.</text>

  <text x="70" y="154" class="lane">PUBLIC EDGE</text>
  <text x="410" y="154" class="lane">AWS APPLICATION</text>
  <text x="980" y="154" class="lane">MEMORY + AI</text>

  <rect x="70" y="185" width="245" height="118" class="box" fill="#ffffff"/>
  <text x="96" y="226" class="node-title">Browser</text>
  <text x="96" y="254" class="node-copy">Operator dashboard</text>
  <text x="96" y="277" class="node-copy">HTTPS, one public origin</text>

  <rect x="405" y="185" width="270" height="118" class="box" fill="#ffffff"/>
  <text x="431" y="226" class="node-title">Amazon CloudFront</text>
  <text x="431" y="254" class="node-copy">TLS delivery + SPA routing</text>
  <text x="431" y="277" class="node-copy">Routes /api/* to backend</text>

  <rect x="755" y="185" width="250" height="118" class="box" fill="#ffffff"/>
  <text x="781" y="226" class="node-title">Private Amazon S3</text>
  <text x="781" y="254" class="node-copy">Versioned React build</text>
  <text x="781" y="277" class="node-copy">Origin Access Control</text>

  <path d="M315 244 H405" class="line"/>
  <text x="334" y="231" class="edge-label">HTTPS</text>
  <path d="M675 220 H755" class="line"/>
  <text x="691" y="207" class="edge-label">assets</text>

  <rect x="405" y="390" width="270" height="118" class="box" fill="url(#compute)"/>
  <text x="431" y="431" class="node-title">API Gateway HTTP API</text>
  <text x="431" y="459" class="node-copy">Bounded public API</text>
  <text x="431" y="482" class="node-copy">2 req/s, burst 5</text>

  <rect x="755" y="365" width="360" height="168" class="box" fill="url(#compute)"/>
  <text x="781" y="406" class="node-title">AWS Lambda · FastAPI</text>
  <text x="781" y="437" class="node-accent">1. Deterministic reliability engine</text>
  <text x="781" y="463" class="node-copy">2. Immutable incident snapshot</text>
  <text x="781" y="486" class="node-copy">3. Memory retrieval + bounded diagnosis</text>
  <text x="781" y="509" class="node-copy">No autonomous remediation</text>

  <path d="M540 303 V390" class="line"/>
  <text x="551" y="350" class="edge-label">/api/*</text>
  <path d="M675 449 H755" class="line"/>
  <text x="690" y="436" class="edge-label">proxy</text>

  <rect x="1180" y="335" width="205" height="228" class="box" fill="url(#memory)"/>
  <text x="1206" y="377" class="node-title">CockroachDB</text>
  <text x="1206" y="405" class="node-accent">Persistent memory layer</text>
  <text x="1206" y="436" class="node-copy">Pipelines + runs</text>
  <text x="1206" y="459" class="node-copy">Incidents + diagnoses</text>
  <text x="1206" y="482" class="node-copy">JSONB evidence</text>
  <text x="1206" y="505" class="node-copy">VECTOR(256) embeddings</text>
  <text x="1206" y="528" class="node-copy">Cosine vector index</text>

  <path d="M1115 423 H1180" class="memory-line"/>
  <text x="1122" y="408" class="edge-label">store</text>
  <path d="M1180 492 H1115" class="memory-line"/>
  <text x="1120" y="520" class="edge-label">retrieve</text>

  <rect x="755" y="632" width="360" height="136" class="box" fill="url(#ai)"/>
  <text x="781" y="673" class="node-title">Amazon Bedrock</text>
  <text x="781" y="703" class="node-copy">Titan Text Embeddings V2 · 256-D</text>
  <text x="781" y="727" class="node-copy">Nova Lite · structured diagnosis</text>
  <text x="781" y="751" class="node-copy">Validated output + confidence ceiling</text>

  <path d="M920 533 V632" class="line"/>
  <text x="935" y="585" class="edge-label">invoke approved models</text>

  <rect x="70" y="632" width="245" height="136" class="box" fill="#ffffff"/>
  <text x="96" y="673" class="node-title">AWS Systems Manager</text>
  <text x="96" y="703" class="node-copy">One SecureString</text>
  <text x="96" y="727" class="node-copy">Restricted dra_app URL</text>
  <text x="96" y="751" class="node-copy">Loaded at cold start</text>

  <rect x="405" y="632" width="270" height="136" class="box" fill="#ffffff"/>
  <text x="431" y="673" class="node-title">Amazon CloudWatch</text>
  <text x="431" y="703" class="node-copy">Structured, redacted logs</text>
  <text x="431" y="727" class="node-copy">Dependency metrics</text>
  <text x="431" y="751" class="node-copy">Errors, latency, alarms</text>

  <path d="M315 700 C500 700 565 570 755 500" class="support-line"/>
  <text x="335" y="620" class="edge-label">decrypt at runtime</text>
  <path d="M755 520 C650 570 600 610 540 632" class="support-line"/>
  <text x="604" y="582" class="edge-label">logs + metrics</text>

  <rect x="70" y="824" width="1315" height="2" fill="#cbd5e1"/>
  <text x="70" y="860" class="subtitle">Trust boundary: rules own incident facts and lifecycle; AI can only explain evidence and recommend safe investigation steps.</text>
</svg>
